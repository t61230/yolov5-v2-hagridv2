# COCO 2017 dataset http://cocodataset.org
# Download command: bash yolov5/data/get_coco2017.sh
# Train command: python train.py --data coco.yaml
# Default dataset location is next to /yolov5:
#   /parent_folder
#     /coco
#     /yolov5


# train and val data as 1) directory: path/images/, 2) file: path/images.txt, or 3) list: [path1/images/, path2/images/]
train: /mnt/dataset/HaGRIDv2/hagrid_yolo_format/train.txt  # 118287 images
val: /mnt/dataset/HaGRIDv2/hagrid_yolo_format/val.txt  # 5000 images
test: /mnt/dataset/HaGRIDv2/hagrid_yolo_format/test.txt  # 20288 of 40670 images, submit to https://competitions.codalab.org/competitions/20794

# number of classes
nc: 34

# class names
names: ['grabbing', 'grip', 'holy', 'point', 'call', 'three3', 'timeout', 'xsign', 'hand_heart', 'hand_heart2',
        'little_finger', 'middle_finger', 'take_picture', 'dislike', 'first', 'four', 'like', 'mute', 'ok', 'one',
        'palm', 'peace', 'peace_inverted', 'rock', 'stop', 'stop_inverted', 'three', 'three2', 'two_up', 'two_up_inverted',
        'three_gun', 'thumb_index', 'thumb_index2', 'no_gesture']

